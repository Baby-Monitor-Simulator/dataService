name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # -------------------
  # Linting / Static Analysis
  # -------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run linting (Checkstyle / SpotBugs / PMD)
        # run: mvn -B validate
        run: mvn verify -B -Dcheckstyle.consoleOutput=true -Dpmd.consoleOutput=true

  # -------------------
  # Unit Tests
  # -------------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint  # Only run after lint passes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  # -------------------
  # Integration Tests
  # -------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests  # Only run after unit tests pass
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify

  # -------------------
  # Package / Build Artifact
  # -------------------
  build:
    runs-on: ubuntu-latest
    needs: integration-tests  # Only run after integration tests pass
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build package
        run: mvn -B package -DskipTests
